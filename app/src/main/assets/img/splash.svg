<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- volumen: sombra interior abajo-derecha, brillo arriba-izquierda, sombra proyectada -->
    <filter id="v" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feOffset in="b" dx="-14" dy="-18" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="arithmetic" k2="1" k3="-1" result="r1"/>
      <feFlood flood-color="#6e1200" flood-opacity=".42"/><feComposite in2="r1" operator="in" result="dark"/>
      <feOffset in="b" dx="12" dy="16" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="arithmetic" k2="1" k3="-1" result="r2"/>
      <feFlood flood-color="#ffe9b0" flood-opacity=".38"/><feComposite in2="r2" operator="in" result="light"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="ds"/><feOffset in="ds" dx="0" dy="14" result="dso"/>
      <feFlood flood-color="#5a0e00" flood-opacity=".35"/><feComposite in2="dso" operator="in" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
    </filter>
    <linearGradient id="g1" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#ff5a24"/><stop offset=".6" stop-color="#f2481c"/><stop offset="1" stop-color="#ff7a2c"/></linearGradient>
    <linearGradient id="g2" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#ffa128"/><stop offset="1" stop-color="#ff8a1c"/></linearGradient>
    <linearGradient id="g3" x1=".4" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fff070"/><stop offset="1" stop-color="#ffc21e"/></linearGradient>
    <linearGradient id="g4" x1=".4" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#ffd23e"/><stop offset="1" stop-color="#ffab1c"/></linearGradient>
  </defs>
  <g filter="url(#v)">
    <!-- chispas y lenguas sueltas -->
    <path d="M478,248C440,262 404,288 378,326" fill="none" stroke="url(#g1)" stroke-width="30" stroke-linecap="round"/>
    <path d="M330,372C318,392 312,410 312,428" fill="none" stroke="url(#g1)" stroke-width="22" stroke-linecap="round"/>
    <path d="M708,322C742,370 758,430 744,494" fill="none" stroke="url(#g1)" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="692" cy="214" rx="32" ry="17" transform="rotate(-14 692 214)" fill="url(#g1)"/>
    <ellipse cx="594" cy="160" rx="22" ry="10" transform="rotate(-12 594 160)" fill="url(#g1)"/>
    <ellipse cx="736" cy="290" rx="9" ry="20" transform="rotate(14 736 290)" fill="url(#g1)"/>
    <!-- capa exterior -->
    <path d="M640,190C612,250 572,284 528,314C448,368 372,420 344,506C330,476 328,444 336,410C276,462 246,532 250,606C258,730 364,814 508,814C658,814 768,724 772,598C776,474 704,392 664,326C644,292 632,246 640,190Z" fill="url(#g1)"/>
    <!-- capa media -->
    <path d="M560,314C536,376 486,420 446,468C408,514 392,556 394,604C372,584 360,560 358,532C330,574 322,620 330,662C350,756 426,806 516,806C626,806 706,740 712,644C718,562 664,500 616,452C584,420 556,378 560,314Z" fill="url(#g2)"/>
    <!-- capa interior -->
    <path d="M534,516C516,566 482,598 460,640C438,682 440,734 478,768C510,796 570,798 610,772C656,742 666,690 646,644C628,604 594,588 572,558C556,538 540,528 534,516Z" fill="url(#g3)"/>
    <path d="M450,606C428,646 418,698 438,742C448,766 466,782 488,792C462,756 456,704 466,662C470,640 462,620 450,606Z" fill="url(#g4)"/>
  </g>
</svg>
