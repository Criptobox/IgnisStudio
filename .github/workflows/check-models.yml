name: Comprobar modelos

# Comprueba que cada modelo del catálogo existe en Hugging Face y muestra su peso y su SHA-256.
on:
  workflow_dispatch:
  push:
    branches-ignore: [ main ]
    paths: [ ".github/workflows/check-models.yml", "app/src/main/assets/js/app.js" ]
  schedule:
    - cron: "17 4 * * 1"   # cada lunes, por si algún modelo desaparece

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consultar Hugging Face
        run: |
          # Lee del catálogo (app.js) cada repositorio, archivo, SHA-256 y peso, y los compara con Hugging Face
          fail=0
          grep -oP "'[\w.-]+/[\w.-]+-GGUF','[^']+\.gguf','[0-9a-f]{64}',[0-9]+" app/src/main/assets/js/app.js | tr -d "'" > catalogo.txt
          [ -s catalogo.txt ] || { echo "::error::No se encontró el catálogo"; exit 1; }
          while IFS=, read -r repo file sha size; do
            h=$(curl -sI --max-time 30 "https://huggingface.co/$repo/resolve/main/$file")
            code=$(echo "$h" | head -1 | awk '{print $2}')
            hsize=$(echo "$h" | grep -i '^x-linked-size:' | tr -d '\r' | awk '{print $2}')
            hsha=$(echo "$h" | grep -i '^x-linked-etag:' | tr -d '\r"' | awk '{print $2}')
            if [ "$code" = "302" ] && [ "$hsize" = "$size" ] && [ "$hsha" = "$sha" ]; then
              echo "OK    $repo/$file ($size bytes)"
            else
              echo "::error::$repo/$file → HTTP $code, peso $hsize (esperado $size), sha $hsha"; fail=1
            fi
          done < catalogo.txt
          exit $fail
