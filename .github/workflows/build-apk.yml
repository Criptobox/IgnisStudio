name: Compilar y publicar APK

# Cada cambio en main compila una versión nueva y la publica en Releases.
# La app la detecta en Ajustes ▸ Actualizaciones y se instala sin salir de ella.
on:
  push:
    branches: [ main ]
    # Cambios solo de documentación no generan una versión nueva
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Usa la versión de Gradle fijada en gradle/wrapper (./gradlew)
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ignis.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ignis.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto KEYSTORE_BASE64. La APK se firmará con una clave temporal y no podrá actualizarse desde la app."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          APK="IgnisStudio-1.0.${VERSION_CODE}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          # Huella SHA-256: la app la comprueba antes de instalar la actualización
          sha256sum "$APK" | cut -d' ' -f1 > "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: IgnisStudio-apk
          path: |
            IgnisStudio-*.apk
            IgnisStudio-*.apk.sha256

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ignis Studio 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Compilación manual' }}
          files: |
            IgnisStudio-*.apk
            IgnisStudio-*.apk.sha256
          make_latest: true
