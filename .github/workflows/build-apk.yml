name: Compilar y publicar APK

# Cada cambio en main compila una versión nueva y la publica en Releases.
# La app la detecta en Ajustes ▸ Actualizaciones y se instala sin salir de ella.
on:
  push:
    branches: [ main ]
    # Cambios solo de documentación no generan una versión nueva
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ya trae el SDK de Android (ANDROID_HOME); Gradle descarga lo que falte
      # Usa la versión de Gradle fijada en gradle/wrapper (./gradlew)
      - uses: gradle/actions/setup-gradle@v5

      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # tolera espacios o saltos de línea al pegar el secreto
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/ignis.jks" \
              || { echo "::error::KEYSTORE_BASE64 no es un base64 válido. Vuelve a pegar el contenido de KEYSTORE_BASE64.txt."; exit 1; }
            [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::Falta el secreto KEYSTORE_PASSWORD."; exit 1; }
            ALIAS="${KEY_ALIAS:-ignis}"
            keytool -list -keystore "$RUNNER_TEMP/ignis.jks" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1 \
              || { echo "::error::La contraseña KEYSTORE_PASSWORD no abre la clave. Revisa que esté copiada sin espacios."; exit 1; }
            grep -qi "^$ALIAS," "$RUNNER_TEMP/ks.txt" \
              || { echo "::error::La clave no tiene el alias '$ALIAS'. KEY_ALIAS debe ser: $(grep -i PrivateKeyEntry "$RUNNER_TEMP/ks.txt" | cut -d, -f1)"; exit 1; }
            echo "Firma correcta: alias '$ALIAS', $(grep -i 'SHA-256' "$RUNNER_TEMP/ks.txt" || true)"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ignis.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto KEYSTORE_BASE64. La APK se firmará con una clave temporal y no podrá actualizarse desde la app."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          APK="IgnisStudio-1.0.${VERSION_CODE}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          # Huella SHA-256: la app la comprueba antes de instalar la actualización
          sha256sum "$APK" | cut -d' ' -f1 > "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: IgnisStudio-apk
          path: |
            IgnisStudio-*.apk
            IgnisStudio-*.apk.sha256

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ignis Studio 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Compilación manual' }}
          files: |
            IgnisStudio-*.apk
            IgnisStudio-*.apk.sha256
          make_latest: true
